# NSMAEP_SOURCE_ONLY=true
# PUBLICATION_EXCLUDED=true
# PUBLIC_REGISTRATION_DISABLED=true
# Jekyll 3 replaces its default exclude list: retain those defaults explicitly.
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - nsmaep/
  # Authoritative questionnaire source remains available to the private build,
  # never to Pages. The entry shell below is rendered from review-tools-entry.html.
  - review-tools/
  - scripts/
  - tests/
  - README.md
